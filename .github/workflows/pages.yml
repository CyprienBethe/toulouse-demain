# Publish the static site (site/) on GitHub Pages:
# https://cyprienbethe.github.io/toulouse-demain/
#
# - runs on every push to main that changes site/**, and on demand;
# - the published folder is a copy of site/ WITHOUT the developer files
#   (tests/ with its synthetic fixtures, package.json, README.md): test data
#   is never served to visitors;
# - if the latest graph release (tag graph-*) has them, it adds
#   demo-responses.json (demonstration mode, ?demo=1) and
#   scenario-filters.json (fallback copy of the scenario filters).
# Pages must be enabled once by hand: Settings → Pages → Source: GitHub Actions.
name: Publier le site

on:
  push:
    branches: [main]
    paths:
      - "site/**"
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time; a running deployment is never cancelled.
concurrency:
  group: pages
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Préparer le site
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Télécharger les fichiers du dernier graphe publié (s'ils existent)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName,createdAt \
            --jq '[.[] | select(.tagName | startswith("graph-"))] | sort_by(.createdAt) | last | .tagName // empty')
          if [[ -z "$tag" ]]; then
            echo "Aucune release graph-* : ni démonstration, ni copie des filtres de scénario."
            exit 0
          fi
          echo "Dernière release du graphe : $tag"
          download() {  # download <asset> <folder>: optional, checked to be valid JSON
            mkdir -p "$2"
            if gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern "$1" --dir "$2" --clobber; then
              if python3 -m json.tool "$2/$1" > /dev/null; then
                echo "$1 ajouté dans $2"
              else
                echo "::warning::$1 de $tag n'est pas du JSON valide : ignoré"
                rm -f "$2/$1"
              fi
            else
              echo "$1 absent de $tag"
            fi
          }
          download demo-responses.json site/demo
          download scenario-filters.json site/data

      - name: Copier le site à publier (sans les tests)
        run: |
          mkdir -p _site
          cp -R site/. _site/
          rm -rf _site/tests _site/node_modules _site/package.json _site/package-lock.json _site/README.md
          if grep -rlF "SYNTHETIC test fixture" _site; then
            echo "::error::une fixture de test se trouve dans le site publié"
            exit 1
          fi
          find _site -type f | sort

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d  # v6.0.0

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          path: _site

  deploy:
    name: Déployer sur GitHub Pages
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write     # publish the site
      id-token: write  # prove that the deployment comes from this workflow
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5.0.1
